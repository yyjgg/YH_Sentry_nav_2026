    odom_to_map_x: 3.5
    odom_to_map_y: 7.5
    odom_to_map_yaw: 0.0
    maptransform_x: -0.9
    maptransform_y: -0.55
    global_z_min: -1.0
    global_z_max: 1.0
    local_z_min: -0.25
